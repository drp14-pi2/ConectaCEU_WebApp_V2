<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/base-styles.css">
    <link rel="stylesheet" href="/pages/my-profile/my-profile.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/img/Mini Logo ConectaCEU.png">
    <script type="module" src="/shared/security/auth-guard.js"></script>
    <script type="module" src="/shared/components/dynamic-content.js" defer></script>
    <script type="module" src="/pages/my-profile/my-profile.js" defer></script>
    <title>ConectaCEU</title>
</head>
<body>
    <dynamic-content src="/shared/components/header.html"></dynamic-content>
    <dynamic-content src="/shared/components/return-button.html"></dynamic-content>
    <main>
        <div class="base-background-shape"></div>
        <div class="base-form-container">
            <form>
                <h1>Meus dados</h1>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="user-document">Documento</label>
                        <div class="input-with-select-container">
                            <select name="select-document-type" id="select-document-type"></select>
                            <input type="text" name="user-document" id="user-document" maxlength="11" readonly>
                        </div>
                    </div>

                    <div class="input-container file-input-container">
                        <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                    </div>

                    <div class="input-container">
                        <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="email">E-mail</label>
                        <input type="email" name="email" id="email" readonly>
                    </div>

                    <div class="input-container">
                        <label for="userName">Nome completo</label>
                        <input type="text" name="userName" id="userName" maxlength="200" readonly>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="birthdate">Data de nascimento</label>
                        <input type="date" name="birthdate" id="birthdate" readonly>
                    </div>

                    <div class="input-container">
                        <label for="phone">Celular</label>
                        <input type="tel" name="phone" id="phone" maxlength="15" readonly>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="secondPhone">Celular secundário</label>
                        <input type="tel" name="secondPhone" id="secondPhone" maxlength="15" readonly>
                    </div>

                    <div class="input-container">
                        <label for="sex">Sexo</label>
                        <select name="sex" id="sex"></select>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="gender">Gênero</label>
                        <select name="gender" id="gender"></select>
                    </div>

                    <div class="input-container">
                        <label for="school">Escola</label>
                        <input type="text" name="school" id="school" readonly>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="zipCode">CEP</label>
                        <input type="text" name="zipCode" id="zipCode" maxlength="9" readonly>
                    </div>

                    <div class="input-container">
                        <label for="street">Logradouro</label>
                        <input type="text" name="street" id="street" readonly>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="addressNumber">Número</label>
                        <input type="text" name="addressNumber" id="addressNumber" readonly>
                    </div>

                    <div class="input-container">
                        <label for="addressComplement">Complemento</label>
                        <input type="text" name="addressComplement" id="addressComplement" readonly>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="neighborhood">Bairro</label>
                        <input type="text" name="neighborhood" id="neighborhood" readonly>
                    </div>

                    <div class="input-container">
                        <label for="educationalUnit">CEU</label>
                        <select name="educationalUnit" id="educationalUnit"></select>
                    </div>
                </div>

                <div class="form-row form-row-col-2 select-user-type">
                    <div class="input-container">
                        <label for="userType">Tipo usuário</label>
                        <select name="userType" id="userType"></select>
                    </div>
                </div>

                <section class="extra-form-data legal-representatives-container">
                    <h2>Área do responsável (obrigatória somente se o aluno for menor de idade)</h2>

                    <div class="inner-extra-form-data legal-representative-1">
                        <h3>Responsável 1</h3>
                        <div class="form-row form-row-col-2">
                            <div class="input-container">
                                <label for="representative-1-name">Nome completo</label>
                                <input type="text" name="representative-1-name" id="representative-1-name" readonly>
                            </div>

                            <div class="input-container">
                                <label for="representative-1-degree">Grau</label>
                                <select name="representative-1-degree" id="representative-1-degree"></select>
                            </div>
                        </div>

                        <div class="form-row form-row-col-2">
                            <div class="input-container">
                                <label for="representative-1-document">Documento</label>
                                <div class="input-with-select-container">
                                    <select name="select-document-type" id="select-rep-1-document-type"></select>
                                    <input type="text" name="representative-1-document" id="representative-1-document" maxlength="11" readonly>
                                </div>
                            </div>

                            <div class="input-container file-input-container">
                                <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                            </div>
                        </div>

                        <div class="form-row form-row-col-2">
                            <div class="input-container file-input-container">
                                <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                            </div>

                            <div class="input-container file-input-container">
                                <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                            </div>
                        </div>
                    </div>
                    
                    <div class="inner-extra-form-data legal-representative-2">
                        <h3>Responsável 2</h3>
                        <div class="form-row form-row-col-2">
                            <div class="input-container">
                                <label for="representative-2-name">Nome completo</label>
                                <input type="text" name="representative-2-name" id="representative-2-name" readonly>
                            </div>

                            <div class="input-container">
                                <label for="representative-2-degree">Grau</label>
                                <select name="representative-2-degree" id="representative-2-degree"></select>
                            </div>
                        </div>

                        <div class="form-row form-row-col-2">
                            <div class="input-container">
                                <label for="representative-2-document">Documento</label>
                                <div class="input-with-select-container">
                                    <select name="select-rep-2-document-type" id="select-rep-2-document-type"></select>
                                    <input type="text" name="representative-2-document" id="representative-2-document" maxlength="11" readonly>
                                </div>
                            </div>

                            <div class="input-container file-input-container">
                                <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                            </div>
                        </div>

                        <div class="form-row form-row-col-2">
                            <div class="input-container file-input-container">
                                <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                            </div>

                            <div class="input-container file-input-container">
                                <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="extra-form-data health-certificate-container">
                    <h2>Atestado de saúde (obrigatória somente se o aluno tiver 70+ anos)</h2>

                    <div class="inner-extra-form-data">
                        <div class="form-row form-row-col-2">
                            <div class="input-container file-input-container">
                                <dynamic-content src="/shared/components/view-file-button.html"></dynamic-content>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="document-emission-container">
                    <!-- Student card -->
                    <div class="emit-document-button pointer-mouse-cursor" id="student-card-button">
                        <span class="emit-document-title">Carteirinha</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                            <path d="M544 144C552.8 144 560 151.2 560 160L560 480C560 488.8 552.8 496 544 496L96 496C87.2 496 80 488.8 80 480L80 160C80 151.2 87.2 144 96 144L544 144zM96 96C60.7 96 32 124.7 32 160L32 480C32 515.3 60.7 544 96 544L544 544C579.3 544 608 515.3 608 480L608 160C608 124.7 579.3 96 544 96L96 96zM240 312C270.9 312 296 286.9 296 256C296 225.1 270.9 200 240 200C209.1 200 184 225.1 184 256C184 286.9 209.1 312 240 312zM208 352C163.8 352 128 387.8 128 432C128 440.8 135.2 448 144 448L336 448C344.8 448 352 440.8 352 432C352 387.8 316.2 352 272 352L208 352zM408 208C394.7 208 384 218.7 384 232C384 245.3 394.7 256 408 256L488 256C501.3 256 512 245.3 512 232C512 218.7 501.3 208 488 208L408 208zM408 304C394.7 304 384 314.7 384 328C384 341.3 394.7 352 408 352L488 352C501.3 352 512 341.3 512 328C512 314.7 501.3 304 488 304L408 304z"/>
                        </svg>
                    </div>

                    <!-- Certificates -->
                    <!-- <div class="emit-document-button pointer-mouse-cursor">
                        <span class="emit-document-title">Certificados</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                            <path d="M192 112L304 112L304 200C304 239.8 336.2 272 376 272L464 272L464 512C464 520.8 456.8 528 448 528L192 528C183.2 528 176 520.8 176 512L176 128C176 119.2 183.2 112 192 112zM352 131.9L444.1 224L376 224C362.7 224 352 213.3 352 200L352 131.9zM192 64C156.7 64 128 92.7 128 128L128 512C128 547.3 156.7 576 192 576L448 576C483.3 576 512 547.3 512 512L512 250.5C512 233.5 505.3 217.2 493.3 205.2L370.7 82.7C358.7 70.7 342.5 64 325.5 64L192 64zM248 320C234.7 320 224 330.7 224 344C224 357.3 234.7 368 248 368L392 368C405.3 368 416 357.3 416 344C416 330.7 405.3 320 392 320L248 320zM248 416C234.7 416 224 426.7 224 440C224 453.3 234.7 464 248 464L392 464C405.3 464 416 453.3 416 440C416 426.7 405.3 416 392 416L248 416z"/>
                        </svg>
                    </div> -->

                    <!-- Student classes -->
                    <div class="emit-document-button pointer-mouse-cursor" id="user-enrollments">
                        <span class="emit-document-title">Grade de aulas do aluno</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                            <path d="M480 160L480 288L352 288L352 160L480 160zM480 352L480 480L352 480L352 352L480 352zM288 288L160 288L160 160L288 160L288 288zM160 352L288 352L288 480L160 480L160 352zM160 96C124.7 96 96 124.7 96 160L96 480C96 515.3 124.7 544 160 544L480 544C515.3 544 544 515.3 544 480L544 160C544 124.7 515.3 96 480 96L160 96z"/>
                        </svg>
                    </div>

                    <!-- User registration -->
                    <div class="emit-document-button pointer-mouse-cursor" id="user-registration-button">
                        <span class="emit-document-title">Ficha de inscrição do aluno</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">

                    </div>

                    <!-- Registration certificate  -->
                    <!-- <div class="emit-document-button pointer-mouse-cursor">
                        <span class="emit-document-title">Atestado de inscrição</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">

                        </svg>
                    </div> -->
                </div>

                <p class="basic-spacing">Consultar <a id="openPrivacyPolicyBtn" class="underline pointer-mouse-cursor">Política de Privacidade</a> e <a id="openTermsOfUseBtn" class="underline pointer-mouse-cursor">Termos de Uso</a>.</p>

                <button type="button" class="account-deletion-button" id="open-deletion-popup">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                        <path d="M262.2 48C248.9 48 236.9 56.3 232.2 68.8L216 112L120 112C106.7 112 96 122.7 96 136C96 149.3 106.7 160 120 160L520 160C533.3 160 544 149.3 544 136C544 122.7 533.3 112 520 112L424 112L407.8 68.8C403.1 56.3 391.2 48 377.8 48L262.2 48zM128 208L128 512C128 547.3 156.7 576 192 576L448 576C483.3 576 512 547.3 512 512L512 208L464 208L464 512C464 520.8 456.8 528 448 528L192 528C183.2 528 176 520.8 176 512L176 208L128 208zM288 280C288 266.7 277.3 256 264 256C250.7 256 240 266.7 240 280L240 456C240 469.3 250.7 480 264 480C277.3 480 288 469.3 288 456L288 280zM400 280C400 266.7 389.3 256 376 256C362.7 256 352 266.7 352 280L352 456C352 469.3 362.7 480 376 480C389.3 480 400 469.3 400 456L400 280z"/>
                    </svg>
                    Solicitar exclusão de conta
                </button>
            </form>
        </div>
    </main>
    <dynamic-content src="/shared/components/footer.html"></dynamic-content>
</body>
</html>

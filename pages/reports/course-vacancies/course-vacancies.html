<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/base-styles.css">
    <link rel="stylesheet" href="/pages/reports/course-vacancies/course-vacancies.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/img/Mini Logo ConectaCEU.png">
    <script type="module" src="/shared/security/auth-guard.js"></script>
    <script type="module" src="/shared/components/dynamic-content.js" defer></script>
    <script type="module" src="/pages/reports/course-vacancies/course-vacancies.js" defer></script>
    <title>ConectaCEU</title>
</head>
<body>
    <dynamic-content src="/shared/components/header.html"></dynamic-content>
    <dynamic-content src="/shared/components/return-button.html"></dynamic-content>
    <main>
        <div class="base-background-shape"></div>
        <div class="base-form-container">
            <h1>Vagas por curso</h1>
            <div class="item-listing-container">
                <form class="search-form">
                    <div class="form-row form-row-col-2">
                        <div class="input-container">
                            <label for="course">Curso</label>
                            <select name="course" id="course">
                                <option value='' selected>Selecionar</option>
                            </select>
                        </div>

                        <div class="button-column">
                            <button type="button" class="search-button">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                                    <path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/>
                                </svg>
                            </button>

                            <button type="button" class="download-button">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                                    <path d="M352 96C352 78.3 337.7 64 320 64C302.3 64 288 78.3 288 96L288 306.7L246.6 265.3C234.1 252.8 213.8 252.8 201.3 265.3C188.8 277.8 188.8 298.1 201.3 310.6L297.3 406.6C309.8 419.1 330.1 419.1 342.6 406.6L438.6 310.6C451.1 298.1 451.1 277.8 438.6 265.3C426.1 252.8 405.8 252.8 393.3 265.3L352 306.7L352 96zM160 384C124.7 384 96 412.7 96 448L96 480C96 515.3 124.7 544 160 544L480 544C515.3 544 544 515.3 544 480L544 448C544 412.7 515.3 384 480 384L433.1 384L376.5 440.6C345.3 471.8 294.6 471.8 263.4 440.6L206.9 384L160 384zM464 440C477.3 440 488 450.7 488 464C488 477.3 477.3 488 464 488C450.7 488 440 477.3 440 464C440 450.7 450.7 440 464 440z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </form>
                <div class="item-listing-result">
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <td>Curso</td>
                                    <td>Total de vagas</td>
                                    <td>Alunos matriculados</td>
                                    <td>Vagas abertas</td>
                                    <td>Taxa de ocupação</td>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    
                    <dynamic-content src="/shared/components/table-page-control.html"></dynamic-content>
                </div>
            </div>
        </div>
    </main>
    <dynamic-content src="/shared/components/footer.html"></dynamic-content>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/base-styles.css">
    <link rel="stylesheet" href="/pages/recover-password/recover-password.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/img/Mini Logo ConectaCEU.png">
    <script src="/shared/components/dynamic-content.js" defer></script>
    <script type="module" src="/pages/recover-password/recover-password.js" defer></script>
    <title>ConectaCEU</title>
</head>
<body>
    <dynamic-content src="/shared/components/header.html"></dynamic-content>
    <main>
        <div class="background-shape"></div>
        <div class="form-container">
            <h1>Trocar senha</h1>
            <form>
                <div class="input-container">
                    <label for="new-password">Nova senha <span class="color-red">*</span></label>
                    <input type="password" name="new-password" id="new-password" minlength="8" maxlength="128" required>
                    <div class="password-requirements">
                        <p>Deve conter:</p>
                        <ul>
                            <li>Entre 8 e 128 caracteres.</li>
                            <li>Pelo menos uma letra maíúscula e uma minúscula.</li>
                            <li>Pelo menos um número.</li>
                            <li>Pelo menos um caractere especial (&excl;, &commat;, #, &dollar;, &amp;, &ast;)</li>
                        </ul>
                    </div>
                </div>
                <div class="input-container">
                    <label for="repeat-password">Repetir senha <span class="color-red">*</span></label>
                    <input type="password" name="repeat-password" id="repeat-password" minlength="8" maxlength="128" required>
                </div>
                <div class="button-row">
                    <button type="button" id="button-submit-form">Enviar</button>
                </div>
            </form>
        </div>
    </main>
    <dynamic-content src="/shared/components/footer.html"></dynamic-content>
</body>
</html>

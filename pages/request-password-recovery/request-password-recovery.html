<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/base-styles.css">
    <link rel="stylesheet" href="/pages/request-password-recovery/request-password-recovery.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/img/Mini Logo ConectaCEU.png">
    <script src="/shared/components/dynamic-content.js" defer></script>
    <script type="module" src="/pages/request-password-recovery/request-password-recovery.js" defer></script>
    <title>ConectaCEU</title>
</head>
<body>
    <dynamic-content src="/shared/components/header.html"></dynamic-content>
    <main>
        <div class="form-container">
            <form>
                <h1>Solicitar troca de senha</h1>
                <div class="input-container">
                    <label for="">Informe seu número de celular ou e-mail do cadastro <span class="color-red">*</span></label>
                    <input type="email" name="email" id="email" placeholder="ex: meu.nome@gmail.com" required>
                </div>
                <div class="button-row">
                    <button type="button" id="button-submit-form">Enviar</button>
                </div>
            </form>
        </div>
    </main>
    <dynamic-content src="/shared/components/footer.html"></dynamic-content>
</body>
</html>

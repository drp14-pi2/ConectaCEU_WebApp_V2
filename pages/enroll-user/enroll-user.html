<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/base-styles.css">
    <link rel="stylesheet" href="/pages/enroll-user/enroll-user.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/img/Mini Logo ConectaCEU.png">
    <script type="module" src="/shared/security/auth-guard.js"></script>
    <script type="module" src="/shared/components/dynamic-content.js" defer></script>
    <script type="module" src="/pages/enroll-user/enroll-user.js" defer></script>
    <title>ConectaCEU</title>
</head>
<body>
    <dynamic-content src="/shared/components/header.html"></dynamic-content>
    <dynamic-content src="/shared/components/return-button.html"></dynamic-content>
    <main>
        <div class="base-background-shape"></div>
        <div class="base-form-container">
            <form>
                <h1 id="page-title"></h1>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="user-document">Documento</label>
                        <div class="input-with-select-container">
                            <select name="select-document-type" id="select-document-type"></select>
                            <input type="text" name="user-document" id="user-document" maxlength="11" readonly>
                        </div>
                    </div>
                    
                    <div class="input-container">
                        <label for="email">E-mail</label>
                        <input type="email" name="email" id="email" readonly>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="userName">Nome completo</label>
                        <input type="text" name="userName" id="userName" maxlength="200" readonly>
                    </div>

                    <div class="input-container">
                        <label for="birthdate">Data de nascimento</label>
                        <input type="date" name="birthdate" id="birthdate" readonly>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="phone">Celular</label>
                        <input type="tel" name="phone" id="phone" maxlength="15" readonly>
                    </div>
                    
                    <div class="input-container">
                        <label for="secondPhone">Celular secundário</label>
                        <input type="tel" name="secondPhone" id="secondPhone" maxlength="15" readonly>
                    </div>
                </div>

                <div class="form-row form-row-col-2">
                    <div class="input-container">
                        <label for="sex">Sexo</label>
                        <select name="sex" id="sex"></select>
                    </div>

                    <div class="input-container">
                        <label for="gender">Gênero</label>
                        <select name="gender" id="gender"></select>
                    </div>
                </div>
            </form>

            <div class="item-listing-container">
                <h2>Matrículas ativas</h2>
                
                <div class="item-listing-result active-enrollments">
                    <div class="table-scroll">
                        <table class="enrollment-table">
                            <thead>
                                <tr>
                                    <td>Curso</td>
                                    <td>Turno</td>
                                    <td>Cancelar matrícula</td>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="base-form-container">
            <h1>Cursos</h1>

            <div class="item-listing-container">
                <form class="search-form">
                    <div class="form-row form-row-col-2">
                        <div class="input-container component-container">
                            <label for="shift-type">Turno</label>
                            <select name="shift-type" id="shift-type">
                                <option value='' selected>Todos</option>
                                <option value='1' selected>Manhã</option>
                                <option value='2' selected>Tarde</option>
                                <option value='3' selected>Noite</option>
                            </select>
                        </div>

                        <button type="button" class="search-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                                <path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/>
                            </svg>
                        </button>
                    </div>
                </form>

                <div class="item-listing-result courses-result">
                    <div class="table-scroll">
                        <table class="courses-table">
                            <thead>
                                <tr>
                                    <td>Curso</td>
                                    <td>Turno</td>
                                    <td>Total de vagas</td>
                                    <td>Carga horária total</td>
                                    <td>Idade mínima</td>
                                    <td>Idade máxima</td>
                                    <td>Matricular</td>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    
                    <dynamic-content src="/shared/components/table-page-control.html"></dynamic-content>
                </div>
            </div>
        </div>
    </main>
    <dynamic-content src="/shared/components/footer.html"></dynamic-content>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/base-styles.css">
    <link rel="stylesheet" href="/pages/manage-users/manage-users.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/img/Mini Logo ConectaCEU.png">
    <script type="module" src="/shared/security/auth-guard.js"></script>
    <script type="module" src="/shared/components/dynamic-content.js" defer></script>
    <script type="module" src="/pages/manage-users/manage-users.js" defer></script>
    <title>ConectaCEU</title>
</head>
<body>
    <dynamic-content src="/shared/components/header.html"></dynamic-content>
    <dynamic-content src="/shared/components/return-button.html"></dynamic-content>
    <main>
        <div class="base-background-shape"></div>
        <div class="base-form-container">
            <h1>Ativar/desativar usuários</h1>
            <div class="item-listing-container">
                <form class="search-form">
                    <div class="form-row form-row-col-3">
                        <div class="input-container">
                            <label for="userName">Nome</label>
                            <input type="text" name="userName" id="userName" placeholder="ex: Joana da Silva" required>
                        </div>
                
                        <div class="input-container">
                            <label for="userDocument">Documento</label>
                            <input type="text" name="userDocument" id="userDocument" size="11" placeholder="ex: 12345678900" required>
                        </div>
                
                        <div class="input-container">
                            <label for="phone">Celular</label>
                            <input type="text" name="phone" id="phone" size="15" placeholder="ex: (11) 91234-5678" required>
                        </div>
                    </div>

                    <div class="form-row form-row-col-3">
                        <div class="input-container">
                            <label for="email">E-mail</label>
                            <input type="text" name="email" id="email" placeholder="ex: nome@sme.prefeitura.sp.gov.br" required>
                        </div>

                        <div class="input-container">
                            <label for="userType">Tipo usuário</label>
                            <select name="userType" id="userType" required>
                                <option value='' selected>Selecionar</option>
                            </select>
                        </div>

                        <div class="input-container">
                            <label for="userStatus">Status usuário</label>
                            <select name="userStatus" id="userStatus" required>
                                <option value='' selected>Selecionar</option>
                                <option value="true">Ativo</option>
                                <option value="false">Inativo</option>
                            </select>
                        </div>
                        <button type="button" class="search-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                                <path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/>
                            </svg>
                        </button>
                    </div>
                </form>
                <div class="item-listing-result">
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <td>Nome</td>
                                    <td>Tipo de documento</td>
                                    <td>Documento</td>
                                    <td>Celular</td>
                                    <td>E-mail</td>
                                    <td>Tipo usuário</td>
                                    <td>Status</td>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    
                    <div class="table-page-control">
                        <div class="table-page-control-start">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                                <path d="M556.2 541.6C544.2 546.6 530.5 543.8 521.3 534.7L352 365.3L352 512C352 524.9 344.2 536.6 332.2 541.6C320.2 546.6 306.5 543.8 297.3 534.7L128 365.3L128 512C128 529.7 113.7 544 96 544C78.3 544 64 529.7 64 512L64 128C64 110.3 78.3 96 96 96C113.7 96 128 110.3 128 128L128 274.7L297.4 105.4C306.6 96.2 320.3 93.5 332.3 98.5C344.3 103.5 352 115.1 352 128L352 274.7L521.4 105.3C530.6 96.1 544.3 93.4 556.3 98.4C568.3 103.4 576 115.1 576 128L576 512C576 524.9 568.2 536.6 556.2 541.6z"/>
                            </svg>
                        </div>
                        <div class="table-page-control-previous">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                                <path d="M491 100.8C478.1 93.8 462.3 94.5 450 102.6L192 272.1L192 128C192 110.3 177.7 96 160 96C142.3 96 128 110.3 128 128L128 512C128 529.7 142.3 544 160 544C177.7 544 192 529.7 192 512L192 367.9L450 537.5C462.3 545.6 478 546.3 491 539.3C504 532.3 512 518.8 512 504.1L512 136.1C512 121.4 503.9 107.9 491 100.9z"/>
                            </svg>
                        </div>
                        <div class="table-page-control-page-number">0</div>
                        <div class="table-page-control-forward">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                                <path d="M149 100.8C161.9 93.8 177.7 94.5 190 102.6L448 272.1L448 128C448 110.3 462.3 96 480 96C497.7 96 512 110.3 512 128L512 512C512 529.7 497.7 544 480 544C462.3 544 448 529.7 448 512L448 367.9L190 537.5C177.7 545.6 162 546.3 149 539.3C136 532.3 128 518.7 128 504L128 136C128 121.3 136.1 107.8 149 100.8z"/>
                            </svg>
                        </div>
                        <div class="table-page-control-last">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                                <path d="M83.8 541.6C95.8 546.6 109.5 543.8 118.7 534.7L288 365.3L288 512C288 524.9 295.8 536.6 307.8 541.6C319.8 546.6 333.5 543.8 342.7 534.7L512 365.3L512 512C512 529.7 526.3 544 544 544C561.7 544 576 529.7 576 512L576 128C576 110.3 561.7 96 544 96C526.3 96 512 110.3 512 128L512 274.7L342.6 105.3C333.4 96.1 319.7 93.4 307.7 98.4C295.7 103.4 288 115.1 288 128L288 274.7L118.6 105.4C109.4 96.2 95.7 93.5 83.7 98.5C71.7 103.5 64 115.1 64 128L64 512C64 524.9 71.8 536.6 83.8 541.6z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <dynamic-content src="/shared/components/footer.html"></dynamic-content>
</body>
</html>

<style>
    .file-input__native {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .file-input {
        position: relative;
        display: flex;
        width: 100%;
        align-items: stretch;
        gap: 0.5rem;
        cursor: pointer;
        border-radius: 8px;
        background: var(--white);
        box-sizing: border-box;
        overflow: hidden;
    }

    .file-input:hover {
        outline: 1px solid var(--medium-blue);
    }

    .file-input:hover .file-input__button {
        background: var(--dark-blue);
        transition: 150ms linear;
    }

    .file-input:focus-within {
        outline: 2px solid #4a90e2;
        outline-offset: 2px;
    }

    .file-input__button {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--medium-blue);
        color: var(--white);
        padding: 0.35rem 0.75rem;
        border-top-left-radius: 4px;
        border-bottom-left-radius: 4px;
        font-weight: 600;
    }

    .file-input__button svg {
        width: 2rem;
        height: 2rem;
        display: block;
        fill: currentColor;
    }

    .file-input__filename {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin: 10px;
    }

    .file-input__clear {
        flex: 0 0 auto;
        align-self: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--medium-blue);
        cursor: pointer;
    }

    .file-input__clear:hover {
        background: var(--light-blue);
        color: var(--dark-blue);
    }

    .file-input__clear[hidden] {
        display: none; /* Ensure hidden is not overwritten by inline-flex */
    }
</style>

<label class="file-input">
  <input type="file" class="file-input__native" />
  <span class="file-input__button">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
      <path d="M342.6 41.4C330.1 28.9 309.8 28.9 297.3 41.4L169.3 169.4C156.8 181.9 156.8 202.2 169.3 214.7C181.8 227.2 202.1 227.2 214.6 214.7L288 141.3L288 576C288 593.7 302.3 608 320 608C337.7 608 352 593.7 352 576L352 141.3L425.4 214.7C437.9 227.2 458.2 227.2 470.7 214.7C483.2 202.2 483.2 181.9 470.7 169.4L342.7 41.4z"/>
    </svg>
  </span>
  <span class="file-input__filename">Nenhum arquivo escolhido</span>
  <button type="button" class="file-input__clear" hidden aria-label="Remover arquivo">
    <!-- X icon -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1rem" height="1rem">
      <path d="M18.3 5.71a1 1 0 0 0-1.42 0L12 10.59 7.12 5.71A1 1 0 0 0 5.7 7.12L10.59 12l-4.89 4.88a1 1 0 1 0 1.42 1.42L12 13.41l4.88 4.89a1 1 0 0 0 1.42-1.42L13.41 12l4.89-4.88a1 1 0 0 0 0-1.41z"/>
    </svg>
  </button>
</label>

<script>
    (() => {
        // find the closest dynamic-content ancestor from this script
        const root = document.currentScript.closest('dynamic-content')
        const input = root.querySelector('.file-input__native')
        const filename = root.querySelector('.file-input__filename')
        const clear = root.querySelector('.file-input__clear')

        if (!input || !filename) return;

        function updateFilename() {
        if (input.files.length) {
            filename.textContent = input.files[0].name
            if (clear) clear.hidden = false
        } else {
            filename.textContent = 'Nenhum arquivo escolhido'
            if (clear) clear.hidden = true
        }
        }

        input.addEventListener('change', updateFilename)
        updateFilename()

        if (clear) {
        clear.addEventListener('click', (e) => {
            e.preventDefault()
            e.stopPropagation()
            input.value = ''
            updateFilename()
            input.dispatchEvent(new Event('change', { bubbles: true }));
        });
        }
    })();
</script>
